<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow｜課業與專題管理</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#25314a;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#1e3560;color:white;padding:26px max(20px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:26px}header p{margin:7px 0 0;color:#d8e4f5}main{max-width:1100px;margin:28px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat,.panel,.task{background:white;border:1px solid #e3eaf5;border-radius:15px;padding:19px;box-shadow:0 4px 17px #152c5110}.stat span{color:#6e7b90;font-size:13px}.stat strong{display:block;font-size:29px;margin-top:9px;color:#1d3d79}.layout{display:grid;grid-template-columns:350px 1fr;gap:22px;margin-top:22px}.panel h2{margin:0 0 17px;font-size:19px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0;font-size:14px;font-weight:600}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cdd8e8;border-radius:9px;background:white;color:#25314a}textarea{resize:vertical}button{font:inherit;border:0;border-radius:9px;cursor:pointer;padding:10px 14px;font-weight:600}.primary{color:white;background:#3268ca}.muted{background:#eaf0fa;color:#264772}.danger{background:#fff0f0;color:#b33030}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.controls input{flex:1;min-width:130px}.controls select{width:auto}.task{margin:12px 0;padding:15px;display:flex;gap:13px;align-items:flex-start;justify-content:space-between}.task.done{opacity:.63}.task.done h3{text-decoration:line-through}.task h3{font-size:16px;margin:0 0 6px}.details{font-size:13px;color:#687995}.task p{margin:7px 0 0;color:#53617a;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;background:#edf3ff;color:#2d58a1;padding:4px 8px;border-radius:99px;font-size:12px;margin-right:5px}.warn{background:#fff0df;color:#995313}.late{background:#ffe5e6;color:#a12c33}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:7px 9px}.empty{text-align:center;color:#7b879d;padding:36px 6px}#notice{min-height:20px;color:#a12c33;margin:8px 0;font-size:13px}footer{max-width:1100px;margin:20px auto;padding:0 18px;color:#8290a7;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.stat{padding:13px}.task{flex-direction:column}.actions{justify-content:flex-start}}
</style></head><body><header><h1>✦ TaskFlow</h1><p>你的作業、考試與專題進度，全部一站管理。</p></header>
<main><section class="stats"><div class="stat"><span>全部任務</span><strong id="total">0</strong></div><div class="stat"><span>已完成</span><strong id="done">0</strong></div><div class="stat"><span>待完成</span><strong id="pending">0</strong></div><div class="stat"><span>已逾期</span><strong id="overdue">0</strong></div><div class="stat"><span>完成率</span><strong id="rate">0%</strong></div></section>
<div class="layout"><section class="panel"><h2 id="form-heading">➕ 新增任務</h2><form id="task-form"><label class="field">任務名稱<input name="title" maxlength="100" placeholder="例：完成資料庫作業" required></label><label class="field">類別<select name="category"><option>作業</option><option>考試</option><option>專題</option><option>其他</option></select></label><label class="field">截止日期<input name="due_date" type="date" required></label><label class="field">優先度<select name="priority"><option>中</option><option>高</option><option>低</option></select></label><label class="field">備註<textarea name="notes" maxlength="1000" rows="3" placeholder="可以記錄作業需求或專題進度"></textarea></label><div id="notice" role="status"></div><button type="submit" class="primary" id="save">儲存任務</button> <button type="button" class="muted" id="cancel" hidden>取消編輯</button></form></section>
<section class="panel"><h2>📋 任務清單 <small id="soon" style="font-size:12px;color:#9a6022"></small></h2><div class="controls"><input id="search" placeholder="搜尋任務名稱或備註"><select id="filter"><option value="all">全部</option><option value="pending">未完成</option><option value="done">已完成</option><option value="overdue">已逾期</option><option value="soon">3 日內到期</option></select></div><div id="tasks"></div></section></div></main><footer>本機版使用 SQLite 資料庫，資料保存在執行程式的電腦上。</footer>
<script>
let tasks=[],today='',editing=null;const form=document.getElementById('task-form');const fields=form.elements;
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
async function api(url,method='GET',data){const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const json=await res.json();if(!res.ok)throw Error(json.error||'操作失敗');return json;}
async function load(){try{const d=await api('/api/tasks');tasks=d.tasks;today=d.today;for(const k of ['total','done','pending','overdue'])document.getElementById(k).textContent=d.summary[k];document.getElementById('rate').textContent=d.summary.rate+'%';document.getElementById('soon').textContent=d.summary.soon?'（3 日內到期：'+d.summary.soon+'）':'';render();}catch(e){notice(e.message)}}
function notice(s){document.getElementById('notice').textContent=s;}
function reset(){editing=null;form.reset();fields.due_date.value=today;document.getElementById('form-heading').textContent='➕ 新增任務';document.getElementById('save').textContent='儲存任務';document.getElementById('cancel').hidden=true;notice('');}
function render(){const box=document.getElementById('tasks');box.replaceChildren();const q=document.getElementById('search').value.trim().toLowerCase();const filter=document.getElementById('filter').value;const shown=tasks.filter(t=>{if(!(t.title.toLowerCase().includes(q)||t.notes.toLowerCase().includes(q)))return false;const overdue=!t.completed&&t.due_date<today;const soon=!t.completed&&t.due_date>=today&&new Date(t.due_date+'T12:00:00')<=new Date(today+'T12:00:00').getTime()+3*86400000;return filter==='all'||filter==='pending'&&!t.completed||filter==='done'&&t.completed||filter==='overdue'&&overdue||filter==='soon'&&soon;});if(!shown.length){box.append(node('div','empty','目前沒有符合條件的任務'));return;}for(const t of shown){const wrap=node('article','task'+(t.completed?' done':''));const left=node('div');left.style.flex='1';left.append(node('h3','',t.title));const info=node('div','details');info.append(node('span','pill',t.category));info.append(node('span','pill','優先度：'+t.priority));info.append(node('span','', '截止：'+t.due_date));if(!t.completed&&t.due_date<today)info.append(node('span','pill late','已逾期'));else if(!t.completed&&t.due_date>=today&&new Date(t.due_date+'T12:00:00')<=new Date(today+'T12:00:00').getTime()+3*86400000)info.append(node('span','pill warn','即將到期'));left.append(info);if(t.notes)left.append(node('p','',t.notes));wrap.append(left);const actions=node('div','actions');for(const [label,cl,fn] of [[t.completed?'取消完成':'✓ 完成','muted',()=>act('/api/tasks/'+t.id+'/toggle','POST')],['編輯','muted',()=>edit(t)],['刪除','danger',()=>{if(confirm('確定刪除「'+t.title+'」？'))act('/api/tasks/'+t.id,'DELETE');}]]){const b=node('button',cl,label);b.type='button';b.onclick=fn;actions.append(b);}wrap.append(actions);box.append(wrap);}}
async function act(url,method){try{await api(url,method);await load();}catch(e){notice(e.message)}}
function edit(t){editing=t.id;fields.title.value=t.title;fields.category.value=t.category;fields.due_date.value=t.due_date;fields.priority.value=t.priority;fields.notes.value=t.notes;document.getElementById('form-heading').textContent='✏️ 編輯任務';document.getElementById('save').textContent='更新任務';document.getElementById('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});}
form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());try{await api(editing?'/api/tasks/'+editing:'/api/tasks',editing?'PUT':'POST',data);reset();await load();}catch(err){notice(err.message);}};
document.getElementById('cancel').onclick=reset;document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;load().then(()=>{if(!editing&&!fields.due_date.value)fields.due_date.value=today;});
</script></body></html>
