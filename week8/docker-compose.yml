services:
  backend:
    build: ./backend
    environment:
      TASKFLOW_DATABASE_URL: sqlite:////app/data/taskflow.db
    volumes: [taskflow_data:/app/data]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports: ["5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  taskflow_data:
