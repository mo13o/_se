<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購物車｜BookNest</title><link rel="stylesheet" href="/styles.css"><script src="/cart.js" type="module"></script></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">B</span><span><strong>BookNest</strong><small>線上書店</small></span></a><nav class="main-nav"><a href="/">探索書籍</a><a class="active" href="/cart.html">購物車</a></nav><a class="cart-link" href="/cart.html" aria-label="購物車，0 件商品"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6M10 20h.01M18 20h.01"/></svg><span class="cart-badge">0</span></a></header><main class="checkout-page"><div class="checkout-heading"><p class="eyebrow">YOUR BOOK BAG</p><h1>購物車與結帳</h1><p>確認數量後，填寫訂購資料即可建立模擬訂單。</p></div><div class="checkout-layout"><section class="cart-panel"><div class="panel-title"><h2>購買書籍</h2><span id="cart-summary">0 件商品</span></div><div id="cart-items"></div><div class="cart-empty" id="cart-empty" hidden><span>◎</span><h3>購物車還是空的</h3><p>到書店挑選一本想讀的書吧。</p><a class="primary-button" href="/">探索書籍 →</a></div></section><aside class="order-panel"><h2>訂購資料</h2><form id="checkout-form"><label>訂購人姓名<input name="customer_name" required maxlength="100" autocomplete="name" placeholder="請輸入姓名"></label><label>電子郵件<input name="customer_email" type="email" required maxlength="254" autocomplete="email" placeholder="example@email.com"></label><div class="order-total"><span>訂單總額</span><strong id="order-total">NT$0</strong></div><p class="form-note">這是課程展示用模擬訂單，不會進行付款。</p><button class="submit-order" id="submit-order" type="submit">確認建立訂單</button><p class="form-message" id="form-message" aria-live="polite"></p></form></aside></div></main><dialog class="order-dialog" id="order-dialog"><div class="success-icon">✓</div><p class="eyebrow">ORDER CREATED</p><h2>訂單建立成功</h2><p>訂單已儲存至 D1 資料庫。</p><dl><div><dt>訂單編號</dt><dd id="success-number"></dd></div><div><dt>訂單金額</dt><dd id="success-total"></dd></div><div><dt>訂單狀態</dt><dd>待處理</dd></div></dl><a class="primary-button" href="/">繼續瀏覽 →</a></dialog><footer><span>© 2026 BookNest</span><span>大學網站開發課程專案</span></footer></body></html>
