<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台｜BookNest</title><link rel="stylesheet" href="/styles.css"><script src="/admin.js" type="module"></script></head><body class="admin-body"><section class="admin-login" id="login-view"><a class="brand" href="/"><span class="brand-mark">B</span><span><strong>BookNest</strong><small>管理後台</small></span></a><div class="login-card"><p class="eyebrow">ADMIN CONSOLE</p><h1>管理員登入</h1><p>登入後可管理書籍、庫存與查看訂單。</p><form id="login-form"><label>管理員帳號<input name="username" required autocomplete="username" value="admin"></label><label>管理員密碼<input name="password" type="password" required autocomplete="current-password"></label><button class="submit-order" type="submit">登入後台</button><p class="form-message" id="login-message" aria-live="polite"></p></form><a class="admin-back" href="/">← 返回前台</a></div></section><div class="admin-shell" id="admin-view" hidden><aside class="admin-sidebar"><a class="brand admin-brand" href="/"><span class="brand-mark">B</span><span><strong>BookNest</strong><small>管理後台</small></span></a><nav><button class="admin-nav active" data-view="books">▤　書籍管理</button><button class="admin-nav" data-view="orders">▱　訂單紀錄</button><a class="admin-nav" href="/">⌂　返回前台</a></nav><button class="logout-button" id="logout">登出</button></aside><main class="admin-main"><header class="admin-top"><div><p class="eyebrow">BOOKNEST CONSOLE</p><h1 id="view-title">書籍管理</h1></div><span id="admin-name"></span></header><section id="books-view"><div class="admin-toolbar"><p>管理全部書籍、售價、庫存與上下架狀態。</p><button class="add-book-button" id="new-book">＋ 新增書籍</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>書籍</th><th>分類</th><th>價格</th><th>庫存</th><th>狀態</th><th>操作</th></tr></thead><tbody id="books-table"></tbody></table></div></section><section id="orders-view" hidden><div class="admin-toolbar"><p>所有由前台建立的 D1 訂單。</p></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>訂單編號</th><th>訂購人</th><th>品項</th><th>金額</th><th>狀態</th><th>建立時間</th></tr></thead><tbody id="orders-table"></tbody></table></div></section></main></div><dialog class="book-dialog" id="book-dialog"><form id="book-form"><div class="dialog-heading"><div><p class="eyebrow">BOOK EDITOR</p><h2 id="dialog-title">新增書籍</h2></div><button type="button" id="close-dialog" aria-label="關閉">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>書名<input name="title" required maxlength="200"></label><label>作者<input name="author" required maxlength="100"></label><label>出版社<input name="publisher" required maxlength="100"></label><label>ISBN<input name="isbn" required maxlength="17"></label><label>分類<select name="category_id" required></select></label><label>價格（NT$）<input name="price" type="number" min="0" step="1" required></label><label>庫存數量<input name="stock" type="number" min="0" step="1" required></label><label>狀態<select name="is_active"><option value="1">上架</option><option value="0">下架</option></select></label><label class="full-field">封面圖片網址<input name="image_url" type="url" required></label><label class="full-field">書籍簡介<textarea name="description" rows="4"></textarea></label></div><p class="form-message" id="book-message"></p><div class="dialog-actions"><button class="back-button" type="button" id="cancel-dialog">取消</button><button class="submit-order" type="submit">儲存書籍</button></div></form></dialog></body></html>
